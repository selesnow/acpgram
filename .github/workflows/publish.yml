# Публикация пакета acpgram в npm реестр через GitHub Actions
# Запуск по тегу версии (vX.Y.Z). Тесты и публикация — разные job: у публикующего job нет dev-зависимостей.
# Использует Trusted Publishing (OIDC) без статических токенов NPM_TOKEN.
name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24.22.3
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 24.22.3

      - name: Run tests
        run: npm test

  publish:
    name: Publish package to npm
    needs: test
    environment: npm
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24.22.3
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 24.22.3
          registry-url: 'https://registry.npmjs.org'

      - name: Verify git tag matches package.json version
        run: |
          VERSION="v$(node -p "JSON.parse(require('fs').readFileSync('./package.json', 'utf8')).version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - name: Pin npm version
        run: | # zizmor: ignore[adhoc-packages] версия npm зафиксирована намеренно для воспроизводимой публикации
          npm install -g npm@11.10.0

      - name: Publish to npm
        run: npm publish --ignore-scripts --provenance --access public
