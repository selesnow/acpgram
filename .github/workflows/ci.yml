name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint

  workflow-lint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint 1.7.12
        run: |
          set -euo pipefail
          version=1.7.12
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl -fsSLo "$archive" "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${archive}" | sha256sum --check -
          tar -xzf "$archive" actionlint
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 actionlint "$RUNNER_TEMP/bin/actionlint"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Run actionlint
        run: actionlint
      - name: Install zizmor 1.33.1
        run: |
          set -euo pipefail
          version=1.33.1
          archive="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSLo "$archive" "https://github.com/zizmorcore/zizmor/releases/download/v${version}/${archive}"
          echo "3e6a301c7a820a2501915f5a9de8c0486da82bdec7965f068477538a98743d43  ${archive}" | sha256sum --check -
          tar -xzf "$archive" zizmor
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 zizmor "$RUNNER_TEMP/bin/zizmor"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Run zizmor
        run: zizmor --no-online-audits --collect=workflows --persona=regular --color=never .

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Agent sandbox (AGENT_SANDBOX=bwrap): on Linux install bubblewrap and allow it to create user namespaces,
      # otherwise the tests in test/sandbox.test.mjs that run the real sandbox are skipped
      - name: Sandbox prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: npm test
      - name: CLI smoke test
        run: node src/cli.mjs version
