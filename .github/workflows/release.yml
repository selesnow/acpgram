# Release on a version tag (v1.10.0): tests on all OSes -> archives + SHA256SUMS -> GitHub Release ->
# both installers are checked on real Windows / Linux / macOS against the release just published.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 24.22.3
      - run: npm test

  release:
    name: Publish release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create a GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches package.json version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then echo "::error::tag $GITHUB_REF_NAME != package.json $VERSION"; exit 1; fi
      - name: Build archives
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix=acpgram/ -o "dist/acpgram-$GITHUB_REF_NAME.tar.gz" "$GITHUB_REF_NAME"
          git archive --format=zip --prefix=acpgram/ -o "dist/acpgram-$GITHUB_REF_NAME.zip" "$GITHUB_REF_NAME"
          cp install.ps1 install.sh dist/
          cd dist && sha256sum acpgram-* install.ps1 install.sh > SHA256SUMS && cat SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --format=%B "$GITHUB_REF_NAME" | grep -v '^Co-Authored-By:' > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "AcpGram $GITHUB_REF_NAME" --notes-file notes.md --verify-tag

  # Keyless Sigstore signatures (cosign) for every release file: <file>.sigstore.json. A separate job, so a signing
  # problem never affects the release itself. Verify with the command in SECURITY.md.
  sign:
    name: Sign release assets
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the signatures to the release
      id-token: write # keyless signing identity of this workflow
    steps:
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets && cd assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          for f in *; do cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"; done
          gh release upload "$GITHUB_REF_NAME" ./*.sigstore.json --repo "$GITHUB_REPOSITORY"

  # GitHub build provenance attestations, also exported as release assets (*.intoto.jsonl) so OpenSSF Scorecard's
  # Signed-Releases check can detect provenance (it looks for release assets, not the attestations API/store).
  provenance:
    name: Attest release provenance
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload provenance assets to the release
      id-token: write # GitHub attestation OIDC identity
      attestations: write # create build provenance attestations
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets && cd assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          rm -f ./*.sigstore.json
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*
      - name: Upload provenance to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd assets
          for f in *; do
            gh attestation download "$f" --repo "$GITHUB_REPOSITORY" --predicate-type https://slsa.dev/provenance/v1 --limit 1
            bundle=$(ls -1 *.jsonl 2>/dev/null | head -n 1)
            if [ -z "$bundle" ]; then echo "::error::no provenance bundle for $f"; exit 1; fi
            mv "$bundle" "$f.intoto.jsonl"
          done
          gh release upload "$GITHUB_REF_NAME" ./*.intoto.jsonl --repo "$GITHUB_REPOSITORY" --clobber

  notify:
    name: Announce release
    needs: release
    uses: ./.github/workflows/release-notify.yml # zizmor: ignore[self-repository]
    with:
      version: ${{ github.ref_name }}
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

  installers:
    name: Installer (${{ matrix.os }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ACPGRAM_VERSION: ${{ github.ref_name }}
      ACPGRAM_NO_SETUP: '1'
      ACPGRAM_YES: '1'
    steps:
      - name: install.sh (fresh install, then update)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/install.sh"
          curl -fsSL "$URL" | bash
          echo 'KEEP=1' > "$HOME/.local/share/acpgram/.env"
          curl -fsSL "$URL" | bash
          grep -q 'KEEP=1' "$HOME/.local/share/acpgram/.env"
          test "$("$HOME/.local/bin/acpgram" version)" = "${GITHUB_REF_NAME#v}"
      - name: install.ps1 (fresh install, then update)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $url = "https://github.com/$($env:GITHUB_REPOSITORY)/releases/download/$($env:GITHUB_REF_NAME)/install.ps1"
          irm $url | iex
          Set-Content -Path "$env:LOCALAPPDATA\acpgram\.env" -Value 'KEEP=1'
          irm $url | iex
          if (-not (Select-String -Path "$env:LOCALAPPDATA\acpgram\.env" -Pattern 'KEEP=1' -Quiet)) { throw '.env was not kept on update' }
          $v = & "$env:LOCALAPPDATA\acpgram\bin\acpgram.cmd" version
          if ($v -ne $env:GITHUB_REF_NAME.TrimStart('v')) { throw "version $v != $env:GITHUB_REF_NAME" }
