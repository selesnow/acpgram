name: Release notify

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to announce (for example v1.35.3)'
        required: true
        type: string
      dry_run:
        description: 'Print payloads without sending to Telegram'
        type: boolean
        default: true
      chat:
        description: 'Channel for the manual run'
        type: choice
        default: all
        options:
          - all
          - en
          - ru
          - ua
  workflow_call:
    inputs:
      version:
        description: 'Version to announce (for example v1.36.0)'
        required: true
        type: string
      dry_run:
        description: 'Print payloads without sending to Telegram'
        type: boolean
        default: false
      chat:
        description: 'Channel to announce to'
        type: string
        default: all
    secrets:
      BOT_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  notify:
    name: Announce in Telegram
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          package-manager-cache: false
          node-version: 24.22.3
      - name: Send rich messages
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_EN: ${{ vars.CHANNEL || secrets.CHANNEL }}
          CHANNEL_RU: ${{ vars.CHANNEL_RU || secrets.CHANNEL_RU }}
          CHANNEL_UA: ${{ vars.CHANNEL_UA || secrets.CHANNEL_UA }}
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.dry_run }}
          TARGET_CHAT: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.chat || 'all' }}
        run: node .github/scripts/notify-release.mjs
