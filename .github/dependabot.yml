version: 2
updates:
  # versions of the actions used in .github/workflows (they are pinned by commit SHA)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'
    groups:
      github-actions:
        patterns: ['*']

  # the base image of the Dockerfile is pinned by digest; this keeps the digest up to date
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'docker'

  # development-only tools (ESLint); the package has no runtime npm dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'deps'
    groups:
      dev-dependencies:
        dependency-type: development
