version: 2
updates:
  # versions of the actions used in .github/workflows (they are pinned by commit SHA)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'
    groups:
      github-actions:
        patterns: ['*']

  # the package has no npm dependencies today; this starts working as soon as one appears
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'deps'
